name: smart_shopping_chatbot
description: "Smart Shopping Chatbot - RAG-integrated assistant on live product catalog"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Local Storage
  shared_preferences: ^2.5.3

  # UI & Icons
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0

  # Chat UI
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.3.1
  flutter_widget_from_html: ^0.17.2
  markdown: ^7.3.1
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
